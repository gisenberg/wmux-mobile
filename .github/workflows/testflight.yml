name: TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Build and upload
    environment: TestFlight
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - wmux-mobile
    timeout-minutes: 120
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
      ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          clean: true

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 22.13.1

      - name: Install JavaScript dependencies
        run: rtk npm ci

      - name: Run release gate
        run: rtk npm run check

      - name: Prepare App Store Connect authentication
        id: release
        env:
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
        run: rtk node scripts/ci/prepare-testflight.mjs

      - name: Generate the iOS project
        run: rtk npx expo prebuild --platform ios --clean --no-install

      - name: Apply the iOS release version
        run: |
          rtk /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion $IOS_BUILD_NUMBER" \
            ios/wmux/Info.plist
          rtk /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $IOS_MARKETING_VERSION" \
            ios/wmux/Info.plist

      - name: Install CocoaPods
        run: rtk pod install --project-directory=ios --repo-update

      - name: Archive the application
        run: |
          rtk xcodebuild \
            -workspace ios/wmux.xcworkspace \
            -scheme wmux \
            -configuration Release \
            -quiet \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/testflight-archive.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/testflight-derived-data" \
            -resultBundlePath "$RUNNER_TEMP/testflight-result.xcresult" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_API_KEY_PATH" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_KEY_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$IOS_MARKETING_VERSION" \
            clean archive

      - name: Verify the archived application version
        run: |
          rtk plutil \
            -convert json \
            -o "$RUNNER_TEMP/wmux-app-info.json" \
            "$RUNNER_TEMP/testflight-archive.xcarchive/Products/Applications/wmux.app/Info.plist"
          rtk node \
            scripts/ci/verify-testflight-version.mjs \
            "$RUNNER_TEMP/wmux-app-info.json"

      - name: Export the signed IPA
        run: |
          rtk xcodebuild \
            -exportArchive \
            -quiet \
            -archivePath "$RUNNER_TEMP/testflight-archive.xcarchive" \
            -exportPath "$RUNNER_TEMP/testflight-export" \
            -exportOptionsPlist .github/testflight/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_API_KEY_PATH" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_KEY_ISSUER_ID"

      - name: Upload to TestFlight
        working-directory: ${{ runner.temp }}
        run: |
          rtk /Applications/Transporter.app/Contents/itms/bin/iTMSTransporter \
            -m upload \
            -apiIssuer "$ASC_API_KEY_ISSUER_ID" \
            -apiKey "$ASC_API_KEY_ID" \
            -assetFile "$RUNNER_TEMP/testflight-export/wmux.ipa" \
            -v informational \
            -vp text

      - name: Preserve release artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: wmux-ios-${{ steps.release.outputs.marketing_version }}-${{ steps.release.outputs.build_number }}
          path: |
            ${{ runner.temp }}/testflight-export/wmux.ipa
            ${{ runner.temp }}/testflight-archive.xcarchive/dSYMs
          retention-days: 14

      - name: Preserve build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: wmux-ios-build-diagnostics
          path: ${{ runner.temp }}/testflight-result.xcresult
          retention-days: 7

      - name: Remove the temporary App Store key
        if: always()
        run: rtk node scripts/ci/cleanup-testflight.mjs
