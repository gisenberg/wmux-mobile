name: Android

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/android.yml"
      - "app/**"
      - "app.json"
      - "assets/**"
      - "docker/android/**"
      - "metro.config.js"
      - "modules/**"
      - "package-lock.json"
      - "package.json"
      - "scripts/ci/**"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish installable APK
    runs-on:
      - self-hosted
      - Linux
      - X64
      - homelab
      - android
      - wmux-mobile
    timeout-minutes: 120
    env:
      ANDROID_IMAGE: wmux-mobile-android-ci:latest
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          clean: true

      - name: Prepare persistent build caches
        run: |
          rtk mkdir -p "$HOME/.cache/wmux-mobile-android/gradle"
          rtk mkdir -p "$HOME/.cache/wmux-mobile-android/npm"

      - name: Build the pinned Android toolchain image
        run: |
          rtk docker build \
            --file docker/android/Dockerfile \
            --tag "$ANDROID_IMAGE" \
            docker/android

      - name: Materialize the Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          rtk docker run --rm \
            --env ANDROID_KEYSTORE_BASE64 \
            --env GITHUB_ENV \
            --env RUNNER_TEMP \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --mount "type=bind,source=$RUNNER_TEMP,target=$RUNNER_TEMP" \
            --mount "type=bind,source=$(rtk which rtk),target=/usr/local/bin/rtk,readonly" \
            --workdir /workspace \
            "$ANDROID_IMAGE" \
            rtk node scripts/ci/prepare-android-signing.mjs

      - name: Build the standalone APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          rtk docker run --rm \
            --env ANDROID_KEY_ALIAS \
            --env ANDROID_KEY_PASSWORD \
            --env ANDROID_KEYSTORE_PASSWORD \
            --env ANDROID_KEYSTORE_PATH=/run/secrets/wmux-mobile-release.p12 \
            --env ANDROID_VERSION_CODE \
            --env CI=true \
            --env EXPO_NO_TELEMETRY=1 \
            --env GRADLE_USER_HOME=/home/node/.gradle \
            --env PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --mount "type=bind,source=$HOME/.cache/wmux-mobile-android/gradle,target=/home/node/.gradle" \
            --mount "type=bind,source=$HOME/.cache/wmux-mobile-android/npm,target=/home/node/.npm" \
            --mount "type=bind,source=$ANDROID_KEYSTORE_PATH,target=/run/secrets/wmux-mobile-release.p12,readonly" \
            --mount "type=bind,source=$(rtk which rtk),target=/usr/local/bin/rtk,readonly" \
            --workdir /workspace \
            "$ANDROID_IMAGE" \
            scripts/ci/build-android.sh

      - name: Publish the installable APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rtk docker run --rm \
            --env ANDROID_VERSION_CODE \
            --env GITHUB_API_URL \
            --env GITHUB_REF_NAME \
            --env GITHUB_REF_TYPE \
            --env GITHUB_REPOSITORY \
            --env GITHUB_RUN_NUMBER \
            --env GITHUB_SHA \
            --env GITHUB_STEP_SUMMARY \
            --env GITHUB_TOKEN \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --mount "type=bind,source=$RUNNER_TEMP,target=$RUNNER_TEMP" \
            --mount "type=bind,source=$(rtk which rtk),target=/usr/local/bin/rtk,readonly" \
            --workdir /workspace \
            "$ANDROID_IMAGE" \
            rtk node \
              scripts/ci/publish-android-release.mjs \
              android/app/build/outputs/apk/release/output-metadata.json

      - name: Remove the temporary Android signing key
        if: always() && env.ANDROID_KEYSTORE_PATH != ''
        run: |
          rtk docker run --rm \
            --env ANDROID_KEYSTORE_PATH \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --mount "type=bind,source=$RUNNER_TEMP,target=$RUNNER_TEMP" \
            --mount "type=bind,source=$(rtk which rtk),target=/usr/local/bin/rtk,readonly" \
            --workdir /workspace \
            "$ANDROID_IMAGE" \
            rtk node scripts/ci/cleanup-android-signing.mjs
